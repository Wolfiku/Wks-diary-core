[package]
name = "wks-diary-core"
version = "0.4.0"
edition = "2021"
description = "wks-diary-core backend: stores, serves, merges (line-level), versions, and prunes encrypted vault blobs"

[[bin]]
name = "wks-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
similar = "2"
argon2 = "0.5"
rpassword = "7"
regex = "1"

[profile.release]
lto = true
strip = true
